    <article>
      <main>
        <h1 class="visually-hidden">Maze</h1>
        <p class="visually-hidden">A randomly generated maze that you can draw on with your mouse or finger. Press Space to clear your pen marks.</p>
      </main>
      <section aria-label="Maze links"><a href="https://robog.net/blog/maze-algorithm">learn more about my maze generation algorithm</a> or <a role="button" tabindex="0" onclick="redrawMaze()" onkeydown="if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); redrawMaze(); }">clear pen marks</a></section>
