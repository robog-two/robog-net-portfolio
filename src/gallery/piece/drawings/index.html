<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sam's 2026 Drawings</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }

      body {
        background-color: #212121;
        font-family: "TeX Gyre Heros", sans-serif;
        padding: 2rem 1rem;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      header {
        text-align: center;
        margin-bottom: 3rem;
      }

      h1 {
        color: whitesmoke;
        font-size: 5rem;
        font-weight: bold;
        margin-bottom: -10px;
        letter-spacing: 0.05em;
      }

      .subtitle {
        font-size: 1.1rem;
        font-weight: normal;
        color: whitesmoke;
        letter-spacing: 0.02em;
      }

      .gallery {
        display: flex;
        flex-direction: column;
        gap: 2rem;
      }

      img {
        width: 100%;
        height: auto;
        display: block;
      }

      @media (max-width: 768px) {
        h1 {
          font-size: 2.5rem;
        }

        .subtitle {
          font-size: 1rem;
        }

        body {
          padding: 1.5rem 1rem;
        }
      }
    </style>
  <script src="/_scripts/analytics.js" defer></script>
</head>
  <body>
    <main class="container">
      <header>
        <h1>2026</h1>
        <p class="subtitle">Work for drawing class.</p>
      </header>

      <div class="gallery">
        <img
          src="Knight-IntroDrawing-FigureSketchbook.jpg"
          alt="Figure sketchbook: eight quick brown fountain pen sketches of standing people, including a person playing guitar and a person holding a bag"
        >
        <img src="folioslides-0.jpg" alt="January 26th, intuitive gesture and perceptual grid: a loose charcoal sketch of stacked boxes on a table">
        <img src="folioslides-1.jpg" alt="February 4th, still life using sighting and measuring: a pencil drawing of crates, a fan and boxes stacked together">
        <img src="folioslides-2.jpg" alt="February 9th, negative space study: the gaps around a chair filled in with dark charcoal, leaving the chair as white lines">
        <img src="folioslides-3.jpg" alt="February 18th, topographical drawing of draped fabric: a cloth hanging over a chair, drawn with contour lines">
        <img src="folioslides-4.jpg" alt="February 25th, foreshortened circles: two drawings, one of bottles and jars, and one of a mannequin head beside a light bulb">
        <img src="folioslides-5.jpg" alt="March 2nd, shadow mapping: a charcoal drawing of a pile of potatoes casting soft shadows on a table">
        <img src="Homework1NeilInfalvi.jpg" alt="Homework 1: a light pencil drawing in a spiral sketchbook of a long horizontal machine made of cylinders and rings">
        <img
          src="Homework2_BlindContour_SamKnight.jpeg"
          alt="Homework 2, blind contour: four tangled charcoal line drawings of objects on one sheet of paper"
        >
        <img src="Homework2_Gesture_SamKnight.jpeg" alt="Homework 2, gesture: a pencil sketch of crumpled paper bags stacked on a box labeled Medium">
        <img
          src="Homework3MarkMakingSamKnight.jpg"
          alt="Homework 3, mark making: a grid of sixteen squares, each filled with a different charcoal texture such as hatching, scribbles, dots and bricks"
        >
        <img
          src="SamKnightHomework04FabricStudy.JPG"
          alt="Homework 4, fabric study: a charcoal drawing of a folded cloth pinned up against a wall, using both black and white charcoal to indicate value and describe the texture of fibers"
        >
      </div>
    </main>
  </body>
</html>
