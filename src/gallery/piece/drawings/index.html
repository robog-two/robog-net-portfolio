<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sam's 2026 Drawings</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }

      body {
        background-color: #212121;
        font-family: "TeX Gyre Heros", sans-serif;
        padding: 2rem 1rem;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      header {
        text-align: center;
        margin-bottom: 3rem;
      }

      h1 {
        color: whitesmoke;
        font-size: 5rem;
        font-weight: bold;
        margin-bottom: -10px;
        letter-spacing: 0.05em;
      }

      h2 {
        font-size: 1.1rem;
        font-weight: normal;
        color: whitesmoke;
        letter-spacing: 0.02em;
      }

      .gallery {
        display: flex;
        flex-direction: column;
        gap: 2rem;
      }

      img {
        width: 100%;
        height: auto;
        display: block;
      }

      @media (max-width: 768px) {
        h1 {
          font-size: 2.5rem;
        }

        h2 {
          font-size: 1rem;
        }

        body {
          padding: 1.5rem 1rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>2026</h1>
        <h2>Work for drawing class.</h2>
      </header>

      <div class="gallery">
        <img
          src="Knight-IntroDrawing-FigureSketchbook.jpg"
          alt="Figure Sketchbook"
        >
        <img src="folioslides-0.jpg" alt="Folioslides 0">
        <img src="folioslides-1.jpg" alt="Folioslides 1">
        <img src="folioslides-2.jpg" alt="Folioslides 2">
        <img src="folioslides-3.jpg" alt="Folioslides 3">
        <img src="folioslides-4.jpg" alt="Folioslides 4">
        <img src="folioslides-5.jpg" alt="Folioslides 5">
        <img src="Homework1NeilInfalvi.jpg" alt="Homework 1">
        <img
          src="Homework2_BlindContour_SamKnight.jpeg"
          alt="Homework 2 - Blind Contour"
        >
        <img src="Homework2_Gesture_SamKnight.jpeg" alt="Homework 2 - Gesture">
        <img
          src="Homework3MarkMakingSamKnight.jpg"
          alt="Homework 3 - Mark Making"
        >
        <img
          src="SamKnightHomework04FabricStudy.JPG"
          alt="Homework 4 - Fabric Study"
        >
      </div>
    </div>
  </body>
</html>
